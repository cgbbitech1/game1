:root{
  --bg0:#0b1016; --bg1:#121a22; --bg2:#1a242e; --bg3:#222e3a; --bg4:#2b3947;
  --line:#33424f; --line2:#45566a; --tx:#e3e9ef; --tx2:#a9b6c3; --mute:#6f7f8f;
  --gold:#f5b82e; --gold2:#ffd36a; --red:#e2483b; --grn:#34c37f; --blu:#3d8fe0;
  --axis:#e2483b; --allies:#3d8fe0;
  --fc:'Barlow Condensed',sans-serif; --fb:'Barlow',sans-serif; --fm:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--tx);font-family:var(--fb);font-size:14px;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:var(--fc);cursor:pointer;border:0;color:inherit;background:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#33424f;border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* ---------- panel chrome (HUD) ---------- */
.panel{background:linear-gradient(180deg,#1f2a35 0%,#18212b 100%);border:1px solid var(--line);border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.35);position:relative}
.panel.notch::before{content:'';position:absolute;left:10px;right:10px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);opacity:.55}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--fc);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--tx2)}
.ph .num{color:var(--gold);font-family:var(--fm);font-size:11px;letter-spacing:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px;background:linear-gradient(180deg,#34424f,#27323d);border:1px solid #4a5a6a;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #0b1016;transition:filter .12s,transform .06s}
.btn:hover{filter:brightness(1.18)}.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,#ffcb4f,#e5a313);color:#1b1305;border-color:#ffd978;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 #6d4b05}
.btn.red{background:linear-gradient(180deg,#e9584a,#b9302a);border-color:#f2796c;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #4f120d}
.btn.ghost{background:transparent;border-color:var(--line2);box-shadow:none}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.38;pointer-events:none}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:3px;font-family:var(--fc);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.mono{font-family:var(--fm)}
.gold{color:var(--gold)}

/* unit chip: colored tile with white icon and count beneath (like the reference HUD) */
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{width:30px;display:flex;flex-direction:column;align-items:center;gap:2px}
.chip .tile{width:30px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:var(--c,#3a4a5a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25)}
.chip .tile svg{width:19px;height:19px;fill:#fff}
.chip .n{font-family:var(--fm);font-size:10.5px;color:var(--tx);background:#0e141a;border:1px solid #2d3a46;border-radius:3px;min-width:22px;text-align:center;line-height:13px}
.chip.zero{opacity:.32}
svg.ic{width:18px;height:18px;fill:currentColor;flex:none}

/* ---------- SETUP ---------- */
#setup{position:fixed;inset:0;overflow:auto;background:radial-gradient(1200px 600px at 70% -10%,#24364a 0%,transparent 60%),radial-gradient(900px 500px at 0% 110%,#2a1f1a 0%,transparent 60%),var(--bg0)}
#setup .wrap{max-width:1320px;margin:0 auto;padding:28px 28px 60px}
.brand{display:flex;align-items:center;gap:14px}
.brand .logo{width:46px;height:46px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#c27f08);display:grid;place-items:center;box-shadow:0 0 0 2px #0b1016,0 0 0 3px #6a4a0c}
.brand .logo svg{width:30px;height:30px;fill:#1b1305}
.brand h1{font-family:var(--fc);font-weight:700;font-size:40px;letter-spacing:.08em;line-height:1}
.brand h1 span{color:var(--gold)}
.brand .sub{font-family:var(--fc);letter-spacing:.32em;font-size:12px;color:var(--tx2);text-transform:uppercase;margin-top:4px}
.setup-grid{display:grid;grid-template-columns:1fr 360px;gap:22px;margin-top:26px}
.frow{display:grid;grid-template-columns:64px 1fr 210px 92px;align-items:center;gap:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:transform .12s,border-color .12s}
.frow:hover{transform:translateX(3px);border-color:#5a6b7c}
.frow.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 26px rgba(245,184,46,.18)}
.frow .nm{font-family:var(--fc);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.frow .fl{color:var(--tx2);font-size:13px;margin-top:3px}
.frow .perk{margin-top:7px;font-size:12.5px;color:var(--tx)}
.frow .perk b{font-family:var(--fc);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-size:13px;margin-right:6px}
.portrait{width:64px;height:64px;border-radius:6px;background:#0b1016;position:relative;overflow:hidden;background:var(--c);box-shadow:0 0 0 2px #0b1016,0 0 0 4px var(--c2,#555),inset 0 0 18px rgba(0,0,0,.45)}
.portrait svg{position:absolute;inset:0;width:100%;height:100%}
.portrait .code{position:absolute;left:4px;top:3px;font-family:var(--fc);font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 2px #000;letter-spacing:.08em}
.portrait.sm{width:40px;height:40px;box-shadow:0 0 0 1px #0b1016,0 0 0 2px var(--c2,#555),inset 0 0 12px rgba(0,0,0,.45)}
.portrait.sm .code{font-size:10px}
.radar{width:70px;height:70px;position:relative;flex:none}
.radar svg{width:100%;height:100%}
.econ{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;background:#0d1319;border:1px solid #2c3a47;border-radius:2px;display:flex;gap:2px;padding:1px}
.bar i{flex:1;background:#28343f;border-radius:1px}
.bar i.on{background:var(--c,var(--gold));box-shadow:0 0 6px var(--c,var(--gold))}
.lbl{font-family:var(--fc);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.set{padding:14px 16px}
.set .row{display:flex;justify-content:space-between;align-items:center;margin:11px 0;gap:10px}
.set .row label{font-family:var(--fc);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--tx2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.seg button{padding:5px 9px;font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--tx2);background:#151d25;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--gold);color:#1b1305}
input[type=range]{accent-color:var(--gold);width:130px}
.toggle{width:40px;height:22px;border-radius:11px;background:#2a3642;border:1px solid var(--line2);position:relative;cursor:pointer}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8a98a6;transition:left .15s}
.toggle.on{background:#6b4f0f;border-color:var(--gold)}.toggle.on::after{left:20px;background:var(--gold)}
.cta{display:flex;flex-direction:column;gap:10px;padding:16px}
.cta .btn{height:48px;font-size:17px}
.note{font-size:12px;color:var(--tx2);line-height:1.45}

/* ---------- GAME ---------- */
#game{position:fixed;inset:0;display:grid;grid-template-rows:54px 1fr 30px;grid-template-columns:292px 1fr 350px;grid-template-areas:"top top top" "left map right" "foot foot foot";gap:0}
#top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 14px;background:linear-gradient(180deg,#1d2731,#141c24);border-bottom:1px solid var(--line);position:relative;z-index:5}
#top .brand h1{font-size:24px}#top .brand .logo{width:32px;height:32px}#top .brand .logo svg{width:20px;height:20px}
.rnd{display:flex;flex-direction:column;align-items:center;line-height:1;padding:0 12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.rnd b{font-family:var(--fm);font-size:20px;color:var(--gold)}
.phases{display:flex;gap:4px}
.phase{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;background:#141b22;border:1px solid var(--line);font-family:var(--fc);font-weight:700;letter-spacing:.12em;font-size:13px;text-transform:uppercase;color:var(--mute);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.phase i{font-style:normal;font-family:var(--fm);font-size:11px}
.phase.on{background:linear-gradient(180deg,#ffcb4f,#e5a313);color:#1b1305;border-color:var(--gold)}
.phase.done{color:var(--tx2)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.who .nm{font-family:var(--fc);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:16px}
.simctl{display:flex;align-items:center;gap:6px}
#left{grid-area:left;border-right:1px solid var(--line);background:var(--bg1);overflow:auto;padding:10px}
#right{grid-area:right;border-left:1px solid var(--line);background:var(--bg1);display:flex;flex-direction:column;min-height:0}
#foot{grid-area:foot;display:flex;align-items:center;gap:14px;padding:0 14px;background:#0f151b;border-top:1px solid var(--line);font-family:var(--fc);letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--tx2)}
#foot .msg{color:var(--gold);flex:1;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapwrap{grid-area:map;position:relative;overflow:hidden;background:#0a131b;cursor:grab}
#map{width:100%;height:100%;display:block}
.mapbtns{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mapbtns .btn{width:36px;padding:0;height:34px;font-size:18px}
.mapbtns .btn.txt{width:auto;padding:0 10px;font-size:11px}
.maplegend{position:absolute;left:12px;bottom:12px;padding:8px 10px;display:flex;gap:12px;align-items:center;font-family:var(--fc);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);z-index:3}
.maplegend i{display:inline-block;width:18px;height:0;border-top:2px solid #6c8296;vertical-align:middle;margin-right:5px}
.maplegend i.sea{border-top:2px dashed #4a90c7}
.banner{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:10px 22px;font-family:var(--fc);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:18px;z-index:4;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.tip{position:absolute;pointer-events:none;z-index:6;padding:8px 10px;min-width:170px;font-size:12px}
.tip h4{font-family:var(--fc);letter-spacing:.1em;text-transform:uppercase;font-size:15px;margin-bottom:4px}

/* roster cards */
.fcard{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:9px 10px 10px;margin-bottom:8px;border-left:3px solid var(--c)}
.fcard.act{border-color:var(--gold);border-left-color:var(--c);box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(245,184,46,.15)}
.fcard.dead{opacity:.45;filter:grayscale(.7)}
.fcard .t{display:flex;align-items:center;gap:6px;font-family:var(--fc);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.fcard .t .you{background:var(--gold);color:#1b1305}
.fcard .m{display:flex;gap:10px;font-family:var(--fm);font-size:11px;color:var(--tx2);margin:2px 0 6px}
.fcard .m b{color:var(--gold);font-weight:500}
.fcard .chips{gap:3px}.fcard .chip{width:26px}.fcard .chip .tile{width:26px;height:21px}.fcard .chip .tile svg{width:15px;height:15px}
.sidehdr{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px;font-family:var(--fc);font-weight:700;letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.vp{display:flex;gap:4px}
.vp span{width:20px;height:20px;border-radius:3px;display:grid;place-items:center;font-size:10px;font-family:var(--fm);background:#141b22;border:1px solid var(--line)}

/* right panel */
#act{flex:1;overflow:auto;padding:12px}
#log{height:26%;min-height:150px;border-top:1px solid var(--line);display:flex;flex-direction:column}
#log .ph{padding:7px 12px}
#loglist{flex:1;overflow:auto;padding:4px 10px 10px;font-size:12px;line-height:1.4}
.le{padding:5px 0 5px 9px;border-left:2px solid var(--c,#555);margin:3px 0;color:var(--tx2)}
.le b{font-family:var(--fc);letter-spacing:.1em;text-transform:uppercase;color:var(--c,#aaa);font-size:12px;margin-right:5px}
.le.k-capital,.le.k-win{color:var(--tx);background:rgba(245,184,46,.07)}
.le .r{font-family:var(--fm);color:var(--mute);font-size:10px;float:right;margin-left:6px}
.h2{font-family:var(--fc);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05}
.hint{color:var(--tx2);font-size:12.5px;line-height:1.45;margin:6px 0 12px}
.ucard{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:7px 8px;margin-bottom:6px;background:#141c24;border:1px solid var(--line);border-radius:5px}
.ucard .ico{width:38px;height:34px;border-radius:4px;background:var(--c);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.ucard .ico svg{width:24px;height:24px;fill:#fff}
.ucard .nm{font-family:var(--fc);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.ucard .st{font-family:var(--fm);font-size:10.5px;color:var(--tx2)}
.ucard .st b{color:var(--gold);font-weight:500}
.step{display:flex;align-items:center;gap:4px}
.step button{width:26px;height:26px;border-radius:4px;background:#26323d;border:1px solid var(--line2);font-size:16px;font-weight:700;line-height:1}
.step button:hover{background:#34424f}
.step .v{min-width:26px;text-align:center;font-family:var(--fm);font-size:14px}
.treas{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:10px}
.treas .big{font-family:var(--fm);font-size:26px;color:var(--gold)}
.oddsbox{display:flex;align-items:center;gap:12px;padding:10px;margin:10px 0}
.oddsbox .pct{font-family:var(--fm);font-size:28px}
.srcgrp{margin:8px 0;padding:8px;background:#121920;border:1px solid var(--line);border-radius:5px}
.srcgrp h5{font-family:var(--fc);letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--tx2);margin-bottom:6px;display:flex;justify-content:space-between}
.urow{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;padding:3px 0}
.urow .ico{width:24px;height:20px;border-radius:3px;background:var(--c);display:grid;place-items:center}
.urow .ico svg{width:14px;height:14px;fill:#fff}
.urow .nm{font-size:12.5px}
.urow .nm small{color:var(--mute);font-family:var(--fm);font-size:10px;margin-left:4px}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
.tinfo{padding:10px 12px;margin-top:10px}
.divider{height:1px;background:var(--line);margin:12px 0}

/* ---------- modal / overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(5,8,11,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{width:min(980px,96vw);max-height:92vh;overflow:auto}
.modal .body{padding:16px 18px}
.rules h3{font-family:var(--fc);letter-spacing:.1em;text-transform:uppercase;font-size:17px;color:var(--gold);margin:14px 0 4px}
.rules p{color:var(--tx2);line-height:1.55;font-size:13.5px}
.rules table{border-collapse:collapse;margin:6px 0;font-size:13px}
.rules td,.rules th{border:1px solid var(--line);padding:4px 10px;text-align:center}
.rules th{font-family:var(--fc);letter-spacing:.1em;text-transform:uppercase;color:var(--tx2)}

/* battle */
#battle .modal{width:min(1080px,98vw)}
.bhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.bside{display:flex;align-items:center;gap:10px}
.bside.r{justify-content:flex-end;text-align:right}
.bside .nm{font-family:var(--fc);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.bside .rl{font-family:var(--fc);font-size:11px;letter-spacing:.2em;color:var(--tx2);text-transform:uppercase}
.btitle{text-align:center}
.btitle .h{font-family:var(--fc);font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase}
.btitle .s{font-family:var(--fm);color:var(--gold);font-size:12px}
#bcanvas{display:block;width:100%;height:auto;background:#000;border-bottom:1px solid var(--line)}
.bstage{position:relative}
.bbanner{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-family:var(--fc);font-weight:700;font-size:22px;letter-spacing:.24em;text-transform:uppercase;padding:6px 18px;background:rgba(10,14,18,.78);border:1px solid var(--gold);color:var(--gold);border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.bbanner.on{opacity:1}
.bdice{display:grid;grid-template-columns:1fr 160px 1fr;gap:12px;padding:12px 16px}
.tray{background:#0f151b;border:1px solid var(--line);border-radius:6px;padding:8px;min-height:92px}
.tray h5{font-family:var(--fc);letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--tx2);display:flex;justify-content:space-between;margin-bottom:6px}
.tray h5 b{color:var(--gold);font-family:var(--fm);font-weight:500}
.dgrp{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:3px 0}
.dgrp .lab{font-family:var(--fm);font-size:10px;color:var(--mute);width:58px;flex:none}
.die{width:20px;height:20px;border-radius:4px;background:linear-gradient(145deg,#f4f1ea,#cfc9bd);position:relative;box-shadow:0 2px 0 #7e786c,inset 0 1px 0 #fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:2px}
.die i{width:4px;height:4px;border-radius:50%;background:#1d1d1d;align-self:center;justify-self:center;visibility:hidden}
.die.hit{background:linear-gradient(145deg,#ffd76b,#f0a417);box-shadow:0 0 0 1px #fff3c4,0 0 10px rgba(255,190,40,.9),0 2px 0 #8a5b05}
.die.miss{opacity:.45}
.die.tum{animation:tumble .12s linear infinite}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}50%{transform:rotate(18deg) translateY(-3px)}100%{transform:rotate(-12deg) translateY(0)}}
.bmid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.bmid .pct{font-family:var(--fm);font-size:24px}
.bfoot{display:flex;gap:10px;justify-content:center;padding:0 16px 14px}
.bfoot .btn{min-width:150px}
.bres{font-family:var(--fc);letter-spacing:.1em;text-transform:uppercase;font-size:14px;color:var(--tx2);text-align:center;padding:0 16px 10px}
.bforce{display:flex;gap:3px;flex-wrap:wrap}
.bforce .chip{width:24px}.bforce .chip .tile{width:24px;height:20px}.bforce .chip .tile svg{width:14px;height:14px}

/* end screen / batch */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.stat{padding:10px 12px}
.stat .v{font-family:var(--fm);font-size:26px;color:var(--gold)}
.hbar{height:16px;background:#0d1319;border:1px solid var(--line);border-radius:3px;overflow:hidden;display:flex}
.hbar span{display:block;height:100%}
.prog{height:12px;background:#0d1319;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.prog span{display:block;height:100%;background:linear-gradient(90deg,#e5a313,#ffd36a);transition:width .15s}
table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res td,table.res th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.res th{font-family:var(--fc);letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);font-size:12px}

/* map elements */
.terr{transition:fill .35s}
.mk{cursor:pointer}
.mk .ring{fill:none;stroke-width:3;opacity:0}
.mk.tgt .ring{opacity:1;stroke:#ff5b4d;stroke-dasharray:5 4;animation:spin 6s linear infinite}
.mk.dst .ring{opacity:1;stroke:#5ee0a0;stroke-dasharray:5 4;animation:spin 6s linear infinite}
.mk.src .ring{opacity:1;stroke:#5ee0a0}
.mk.sel .ring{opacity:1;stroke:var(--gold);stroke-dasharray:none;stroke-width:3.5}
@keyframes spin{to{stroke-dashoffset:-90}}
.pulse{animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}
@media (max-width:1200px){#game{grid-template-columns:250px 1fr 320px}}
@media (max-width:980px){.setup-grid{grid-template-columns:1fr}.frow{grid-template-columns:56px 1fr}.frow .econ,.frow .radar{display:none}}

.actfoot{position:sticky;bottom:-12px;margin:10px -12px -12px;padding:8px 12px 12px;background:linear-gradient(180deg,rgba(18,26,34,.9),#121a22 30%);border-top:1px solid var(--line);z-index:2}
.actfoot .oddsbox{margin:0 0 4px}
#top .brand h1{white-space:nowrap}#top{gap:12px}.simctl .seg button{padding:5px 7px}@media (max-width:1400px){#top .brand h1{display:none}}
.portrait .code{background:rgba(11,16,22,.72);padding:0 3px;border-radius:2px;text-shadow:none}

/* ================= HIGH-TECH / DIGITAL THEME ================= */
:root{
  --gold:#3ee8ff; --gold2:#9af4ff; --cy:#3ee8ff; --amber:#ffb63b;
  --bg0:#03080d; --bg1:#061019; --bg2:#0a1824; --line:#123346; --line2:#1d4d66; --tx:#d8f6ff; --tx2:#7fb4c8; --mute:#4c7487;
  --fc:'Barlow Condensed',sans-serif;
}
html,body{background:var(--bg0)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:199;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#setup{background:
  linear-gradient(rgba(62,232,255,.045) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(62,232,255,.045) 1px,transparent 1px) 0 0/40px 40px,
  radial-gradient(1100px 600px at 75% -10%,rgba(30,120,170,.35),transparent 60%),var(--bg0)}
/* panels: angled corners + corner brackets + glow */
.panel{background:linear-gradient(180deg,rgba(10,32,46,.92),rgba(5,16,25,.94));border:1px solid var(--line2);border-radius:0;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  box-shadow:inset 0 0 0 1px rgba(62,232,255,.06),inset 0 0 24px rgba(62,232,255,.05)}
.panel::after{content:'';position:absolute;inset:3px;pointer-events:none;
  background:
   linear-gradient(var(--cy),var(--cy)) top left/12px 1.5px no-repeat,
   linear-gradient(var(--cy),var(--cy)) top left/1.5px 12px no-repeat,
   linear-gradient(var(--cy),var(--cy)) bottom right/12px 1.5px no-repeat,
   linear-gradient(var(--cy),var(--cy)) bottom right/1.5px 12px no-repeat;opacity:.75}
.panel.notch::before{background:linear-gradient(90deg,transparent,var(--cy) 15%,var(--cy) 85%,transparent);opacity:.8;box-shadow:0 0 10px var(--cy)}
.ph{color:var(--cy);text-shadow:0 0 8px rgba(62,232,255,.5);border-bottom:1px dashed var(--line2)}
.ph .num{color:var(--amber)}
.ph::before{content:'▮';color:var(--cy);font-size:10px;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.lbl{color:var(--mute);font-family:var(--fm);letter-spacing:.12em;font-size:10px}
.h2,.brand h1,.frow .nm,.fcard .t,.bside .nm,.btitle .h{text-shadow:0 0 12px currentColor}
.brand h1 span{color:var(--cy);text-shadow:0 0 14px var(--cy)}
.brand .logo{background:transparent;border:1.5px solid var(--cy);box-shadow:0 0 14px rgba(62,232,255,.5),inset 0 0 14px rgba(62,232,255,.25);border-radius:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.brand .logo svg{fill:var(--cy)}
.brand .sub{color:var(--cy);opacity:.7;font-family:var(--fm);letter-spacing:.3em;font-size:11px}
/* buttons */
.btn{border-radius:0;background:rgba(10,40,58,.6);border:1px solid var(--line2);box-shadow:inset 0 0 12px rgba(62,232,255,.08);color:var(--tx);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn:hover{background:rgba(62,232,255,.14);border-color:var(--cy);box-shadow:0 0 14px rgba(62,232,255,.35),inset 0 0 14px rgba(62,232,255,.2);filter:none}
.btn.gold{background:linear-gradient(180deg,rgba(62,232,255,.95),rgba(20,170,210,.95));color:#021018;border-color:#bff8ff;box-shadow:0 0 18px rgba(62,232,255,.55)}
.btn.gold:hover{background:#7ff1ff}
.btn.red{background:linear-gradient(180deg,rgba(255,70,85,.9),rgba(170,20,40,.9));border-color:#ff8a95;box-shadow:0 0 16px rgba(255,60,80,.45)}
.btn.ghost{background:transparent}
.seg{border-radius:0;border-color:var(--line2)}
.seg button{background:rgba(6,20,30,.8);font-family:var(--fm);font-size:11px;color:var(--tx2)}
.seg button.on{background:var(--cy);color:#021018;box-shadow:0 0 10px var(--cy)}
.toggle{border-radius:0}.toggle::after{border-radius:0}
.toggle.on{background:rgba(62,232,255,.25);border-color:var(--cy)}.toggle.on::after{background:var(--cy);box-shadow:0 0 8px var(--cy)}
input[type=range]{accent-color:var(--cy)}
/* chips & bars */
.chip .tile{border-radius:0;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,0 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 0 8px color-mix(in srgb,var(--c) 60%,transparent)}
.chip .n{border-radius:0;background:#020a10;border-color:var(--line2);color:var(--cy)}
.bar{border-radius:0;background:#020a10;border-color:var(--line2)}
.bar i{border-radius:0;background:#0b2230}
.bar i.on{box-shadow:0 0 6px var(--c,var(--cy))}
.portrait{border-radius:0;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));box-shadow:none;outline:1px solid var(--c)}
.portrait::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.portrait .code{font-family:var(--fm);font-size:10px;background:rgba(2,10,16,.8);color:var(--cy)}
.frow.sel{border-color:var(--cy);box-shadow:0 0 24px rgba(62,232,255,.25)}
.frow .perk b{color:var(--cy)}
/* game frame */
#top{background:linear-gradient(180deg,rgba(8,30,44,.97),rgba(3,12,19,.97));border-bottom:1px solid var(--cy);box-shadow:0 0 18px rgba(62,232,255,.25)}
.rnd b{color:var(--cy);text-shadow:0 0 10px var(--cy)}
.phase{background:rgba(6,20,30,.8);border-color:var(--line2);font-family:var(--fm);font-size:11px}
.phase.on{background:var(--cy);color:#021018;border-color:var(--cy);box-shadow:0 0 14px var(--cy)}
#left,#right{background:linear-gradient(180deg,#051019,#03080d)}
#left{border-right:1px solid var(--line2)}#right{border-left:1px solid var(--line2)}
#foot{background:#020a10;border-top:1px solid var(--cy);font-family:var(--fm);font-size:10.5px;color:var(--mute)}
#foot .msg{color:var(--cy);text-shadow:0 0 8px var(--cy)}
#foot .msg::before{content:'> ';opacity:.6}#foot .msg::after{content:'_';animation:blink 1s steps(2) infinite}
.fcard.act{border-color:var(--cy);box-shadow:0 0 18px rgba(62,232,255,.3)}
.fcard .m{color:var(--tx2)}.fcard .m b{color:var(--cy)}
.fcard .t .you{background:var(--cy);color:#021018}
.vp span{border-radius:0;font-family:var(--fm)}
.le{border-left-width:2px;font-family:var(--fb)}
.le .r{color:var(--cy);opacity:.6}
.le.k-capital,.le.k-win{background:rgba(62,232,255,.07)}
.ucard,.srcgrp,.tray{border-radius:0;background:rgba(4,16,24,.85);border-color:var(--line2)}
.ucard .ico,.urow .ico{border-radius:0}
.ucard .st b{color:var(--cy)}
.step button{border-radius:0;background:rgba(10,40,58,.7);border-color:var(--line2);color:var(--cy);font-family:var(--fm)}
.step button:hover{background:rgba(62,232,255,.25)}
.step .v{color:var(--cy)}
.treas .big,.stat .v{color:var(--cy);text-shadow:0 0 12px var(--cy)}
.actfoot{background:linear-gradient(180deg,rgba(5,16,25,.85),#051019 30%);border-top:1px solid var(--line2)}
.tag{border-radius:0;font-family:var(--fm);font-size:10px}
/* map */
#mapwrap{background:#020a12}
.hud{position:absolute;inset:0;pointer-events:none;z-index:2}
.hud .scan{position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,transparent,rgba(62,232,255,.07) 80%,rgba(62,232,255,.35) 100%);animation:scan 6s linear infinite}
@keyframes scan{to{top:100%}}
.hud .br{position:absolute;width:34px;height:34px;border:2px solid var(--cy);opacity:.75;filter:drop-shadow(0 0 4px var(--cy))}
.hud .br.tl{left:10px;top:10px;border-right:0;border-bottom:0}.hud .br.tr{right:10px;top:10px;border-left:0;border-bottom:0}
.hud .br.bl{left:10px;bottom:10px;border-right:0;border-top:0}.hud .br.bbr{right:10px;bottom:10px;border-left:0;border-top:0}

  if(n === 'UA' && (k === 'drn' || k === 'hdr')) c -= 1;
  return c;
}
function atkOf(n, k){
  if(n === 'IL' && k === 'ftr') return 4;
  return UNITS[k].atk;
}
function defOf(n, k, tid){
  if(n === 'UA' && k === 'inf' && tid === 'kyiv') return 3;
  return UNITS[k].def;
}

/* ---------------- state ---------------- */
function newGame(opts){
  const o = Object.assign({}, DEFAULTS, opts||{});
  const st = { opts:o, round:1, turnIdx:0, phase:'purchase', terr:{}, cash:{}, pend:{}, log:[], over:null,
    human: o.human || null, attacked:{}, claimedTurn:false, seed:o.seed, stats:{battles:0, captures:[]} };
  st.rng = makeRng(o.seed);
  TERR.forEach(t => {
    const u = {};
    const s = START[t.id] || {};
    for(const n in s){
      const mult = n === 'N' ? o.neutralMult : o.garrison;
      u[n] = {};
      for(const k in s[n]){
        const v = k === 'inf' ? Math.max(1, Math.round(s[n][k]*mult)) : s[n][k];
        u[n][k] = v;
      }
    }
    st.terr[t.id] = { id:t.id, own:t.own, orig:t.orig || t.own, units:u, moved:{} };
  });
  ORDER.forEach(n => { st.cash[n] = income(st, n); st.pend[n] = {}; });
  log(st, 'SYS', 'Round 1. The Axis (Russia, Iran) faces the Allies (Ukraine, Israel, United States).');
  return st;
}
Object.defineProperty(newGame, 'rngKey', {value:'rng'});

function log(st, who, text, kind){
  st.log.unshift({who, text, round:st.round, kind:kind||''});
  if(st.log.length > 120) st.log.pop();
}
function active(st){ return ORDER[st.turnIdx]; }
function hasCapital(st, n){ return st.terr[NATIONS[n].cap].own === n; }
function income(st, n){
  if(!hasCapital(st, n)) return 0;
  let s = 0;
  for(const id in st.terr) if(st.terr[id].own === n) s += TMAP[id].ipc;
  return s;
}
function unitsOf(st, id, n){ return st.terr[id].units[n] || {}; }
function totalUnits(st, id){ let s=0; for(const n in st.terr[id].units) s += tot(st.terr[id].units[n]); return s; }
function nationArmy(st, n){
  const u = {};
  for(const id in st.terr) addU(u, st.terr[id].units[n]||{});
  return u;
}
function armyValue(st, n){ const u = nationArmy(st,n); let v=0; for(const k in u) v += u[k]*UNITS[k].cost; return v; }
function alive(st, n){ return hasCapital(st, n) || tot(nationArmy(st, n)) > 0; }
function movable(st, id, n){
  const u = unitsOf(st, id, n), m = (st.terr[id].moved[n]) || {};
  const o = {};
  UKEYS.forEach(k => { const v = (u[k]||0) - (m[k]||0); if(v > 0) o[k] = v; });
  return o;
}
function markMoved(st, id, n, units){
  const t = st.terr[id];
  t.moved[n] = t.moved[n] || {};
  addU(t.moved[n], units);
}
function putUnits(st, id, n, units){
  const t = st.terr[id];
  t.units[n] = t.units[n] || {};
  addU(t.units[n], units);
}
function takeUnits(st, id, n, units){
  const t = st.terr[id];
  for(const k in units){
    if(!units[k]) continue;
    t.units[n][k] -= units[k];
    if(t.units[n][k] <= 0) delete t.units[n][k];
  }
  if(t.units[n] && !tot(t.units[n])) delete t.units[n];
}

/* friendly = owned by the nation or an ally */
function partnerOpen(st, id){ const T = TMAP[id]; return T.partner && st.terr[id].own === 'N' ? T.partner : null; }
function isFriendlyTerr(st, id, n){ const o = st.terr[id].own; if(o === n || friends(o, n)) return true; const p = partnerOpen(st, id); return !!p && sideOf(p) === sideOf(n); }
/* where units may END a move: own territory only, unless allied stacking is on */
function room(st, id){ let L = st.opts.stackLimit; if(!L) return 1e9; if(TMAP[id].cap) L = Math.round(L*2.5); return Math.max(0, L - totalUnits(st, id)); }
function canEnter(st, id, n){ const o = st.terr[id].own; return o === n || partnerOpen(st, id) === n || (st.opts.alliedStacking && friends(o, n)); }
function isHostileTerr(st, id, n){ return !isFriendlyTerr(st, id, n); }

/* BFS distances; pass: (id)=>bool whether we may path THROUGH id */
function dists(from, pass, maxD, noSea){
  const d = {[from]:0}, q = [from];
  while(q.length){
    const x = q.shift();
    if(d[x] >= maxD) continue;
    if(x !== from && pass && !pass(x)) continue;
    for(const y of ADJ[x]){
      if(noSea && isSea(x,y)) continue;
      if(d[y] == null){ d[y] = d[x]+1; q.push(y); }
    }
  }
  return d;
}

/* ---------------- attack sources ---------------- */
/* Which of n's units can join an attack on tgt this turn: [{from,k,max}] */
function attackSources(st, n, tgt){
  const out = [];
  for(const id in st.terr){
    if(id === tgt || !st.terr[id].units[n]) continue;
    if(ALLD[id][tgt] == null || ALLD[id][tgt] > 3) continue;
    const mv = movable(st, id, n);
    if(!tot(mv)) continue;
    for(const k of UKEYS){
      if(!mv[k]) continue;
      if(canReach(st, n, k, id, tgt)) out.push({from:id, k, max:mv[k]});
    }
  }
  return out;
}
function canReach(st, n, k, from, tgt){
  const U = UNITS[k];
  if(U.dom === 'land'){
    if(ADJ[from].includes(tgt)) return true;
    if(k === 'arm'){
      // blitz through one friendly territory over land borders
      for(const mid of ADJ[from]){
        if(isSea(from, mid)) continue;
        if(!canEnter(st, mid, n)) continue;
        if(ADJ[mid].includes(tgt) && !isSea(mid, tgt)) return true;
      }
    }
    return false;
  }
  // air: must be able to fly there and back
  const r = Math.floor(U.move/2);
  const d = ALLD[from][tgt];
  return d != null && d <= r;
}
function canAttack(st, n, tgt){
  if(st.attacked[tgt]) return false;
  if(!isHostileTerr(st, tgt, n)) return false;
  return attackSources(st, n, tgt).some(s => UNITS[s.k].dom === 'land');
}

/* ---------------- combat ---------------- */
function defenderNations(st, tid){
  const t = st.terr[tid];
  return Object.keys(t.units).filter(m => tot(t.units[m]));
}
/* units -> list of {n,k,v,from,cost} */
function expandAtk(n, forces){
  const L = [];
  forces.forEach(f => { for(let i=0;i<f.n;i++) L.push({n, k:f.k, from:f.from, v:atkOf(n,f.k), cost:UNITS[f.k].cost}); });
  let art = L.filter(x => x.k === 'art').length;
  L.forEach(x => { if(x.k === 'inf' && art > 0 && x.v < 2){ x.v = 2; art--; } });
  return L;
}
function expandDef(st, tid){
  const L = [], t = st.terr[tid];
  for(const n in t.units){
    for(const k of UKEYS){
      for(let i=0;i<(t.units[n][k]||0);i++) L.push({n, k, v:defOf(n,k,tid), cost:UNITS[k].cost});
    }
  }
  return L;
}
const ORDER_COST = (a,b) => a.cost - b.cost || (a.k==='bmb'?-1:0);
function removeCasualties(list, hits, attacker){
  const killed = [];
  list.sort(ORDER_COST);
  while(hits > 0 && list.length){
    let idx = 0;
    if(attacker){
      const landLeft = list.filter(x => UNITS[x.k].dom === 'land').length;
      const airLeft = list.length - landLeft;
      if(landLeft === 1 && airLeft > 0){
        idx = list.findIndex(x => UNITS[x.k].dom !== 'land');
      }
    }
    killed.push(list.splice(idx,1)[0]);
    hits--;
  }
  return killed;
}

function createBattle(st, n, tgt, forces){
  // forces: [{from,k,n}]
  forces = forces.filter(f => f.n > 0);
  forces.forEach(f => { takeUnits(st, f.from, n, {[f.k]:f.n}); });
  const t = st.terr[tgt];
  const b = { atk:n, tgt, defOwn:t.own, defNations:defenderNations(st, tgt),
    A: expandAtk(n, forces), D: expandDef(st, tgt), round:0, done:false, outcome:null,
    lostA:[], lostD:[], rounds:[], preFire:null, forces: clone(forces) };
  st.attacked[tgt] = true;
  st.stats.battles++;
  // Iron Dome
  if(t.own === 'IL' && b.D.length){
    const air = b.A.filter(x => UNITS[x.k].dom === 'air');
    if(air.length){
      const rolls = air.map(x => ({k:x.k, n:x.n, v:1, u:x, r:1+Math.floor(st.rng()*6)}));
      const hits = rolls.filter(r => r.r <= 1).length;
      const killed = [];
      for(let i=0;i<hits;i++){
        // shoot cheapest aircraft first
        const ac = b.A.filter(x => UNITS[x.k].dom === 'air').sort(ORDER_COST)[0];
        if(ac){ b.A.splice(b.A.indexOf(ac),1); killed.push(ac); }
      }
      b.lostA.push(...killed);
      b.preFire = {rolls, hits, killed};
    }
  }
  if(!b.D.length) { b.done = true; b.outcome = b.A.some(x => UNITS[x.k].dom === 'land') ? 'won' : 'cleared'; }
  if(!b.A.length && !b.done){ b.done = true; b.outcome = 'lost'; }
  return b;
}
function battleRound(st, b){
  if(b.done) return null;
  const rng = st.rng;
  let barrage = null, killedPre = [];
  if(b.round === 0 && st.opts.barrage){
    const pre = b.A.filter(x => x.k === 'art' || x.k === 'bmb');
    if(pre.length){
      const rolls = pre.map(x => ({k:x.k, n:x.n, v:x.v, u:x, r:1+Math.floor(rng()*6), pre:true}));
      const h = rolls.filter(r => r.r <= r.v).length;
      killedPre = removeCasualties(b.D, h, false);
      barrage = {rolls, hits:h, killed:killedPre};
    }
  }
  const rollsA = b.A.filter(x => !(barrage && (x.k === 'art' || x.k === 'bmb'))).map(x => ({k:x.k, n:x.n, v:x.v, u:x, r:1+Math.floor(rng()*6)}));
  const rollsD = b.D.map(x => ({k:x.k, n:x.n, v:x.v, u:x, r:1+Math.floor(rng()*6)}));
  const hitsA = rollsA.filter(r => r.r <= r.v).length;
  const hitsD = rollsD.filter(r => r.r <= r.v).length;
  const killedD = killedPre.concat(removeCasualties(b.D, hitsA, false));
  const killedA = removeCasualties(b.A, hitsD, true);
  b.lostA.push(...killedA); b.lostD.push(...killedD);
  b.round++;
  const res = {round:b.round, rollsA, rollsD, hitsA, hitsD, killedA, killedD, barrage};
  b.rounds.push({round:b.round, hitsA, hitsD});
  const na = b.A.length, nd = b.D.length;
  if(!nd && na) { b.done = true; b.outcome = b.A.some(x => UNITS[x.k].dom === 'land') ? 'won' : 'cleared'; }
  else if(!na){ b.done = true; b.outcome = 'lost'; }
  else if(b.round >= st.opts.maxRounds){ b.done = true; b.outcome = 'stalemate'; }
  return res;
}
function retreatBattle(st, b){ if(!b.done){ b.done = true; b.outcome = 'retreat'; } }

function finishBattle(st, b){
  const n = b.atk, t = st.terr[b.tgt];
  // write back defenders
  const nd = {};
  b.D.forEach(x => { nd[x.n] = nd[x.n] || {}; nd[x.n][x.k] = (nd[x.n][x.k]||0)+1; });
  t.units = nd;
  const tname = TMAP[b.tgt].name;
  const defName = b.defOwn === 'N' ? 'neutral ' + tname : NATIONS[b.defOwn].name;
  let text;
  if(b.outcome === 'won'){
    // land stays, air returns home
    const stay = {};
    b.A.forEach(x => {
      if(UNITS[x.k].dom === 'land') stay[x.k] = (stay[x.k]||0)+1;
      else { putUnits(st, x.from, n, {[x.k]:1}); markMoved(st, x.from, n, {[x.k]:1}); }
    });
    capture(st, n, b.tgt);
    putUnits(st, b.tgt, n, stay); markMoved(st, b.tgt, n, stay);
    text = 'Takes ' + tname + (b.defOwn === 'N' ? ' (neutral)' : ' from ' + defName) + ' after ' + b.round + ' round' + (b.round===1?'':'s') + '. Lost ' + lostText(b.lostA) + '.';
  } else {
    b.A.forEach(x => { putUnits(st, x.from, n, {[x.k]:1}); markMoved(st, x.from, n, {[x.k]:1}); });
    if(b.outcome === 'cleared') text = 'Wipes out the garrison of ' + tname + ' but has no ground troops left to hold it.';
    else if(b.outcome === 'lost') text = 'Assault on ' + tname + ' destroyed. ' + defName + ' holds, losing ' + lostText(b.lostD) + '.';
    else text = (b.outcome === 'retreat' ? 'Withdraws from ' : 'Stalls before ') + tname + ' after ' + b.round + ' rounds. Lost ' + lostText(b.lostA) + '; enemy lost ' + lostText(b.lostD) + '.';
  }
  log(st, n, text, b.outcome === 'won' ? 'capture' : 'battle');
  return text;
}
function lostText(L){
  if(!L.length) return 'nothing';
  const c = {}; L.forEach(x => c[x.k] = (c[x.k]||0)+1);
  return UKEYS.filter(k => c[k]).map(k => c[k] + ' ' + UNITS[k].ab).join(', ');
}
function capture(st, n, tid){
  const t = st.terr[tid], prev = t.own;
  let newOwn = n;
  // liberation: original owner is an ally who still holds (or is regaining) their capital
  const orig = t.orig;
  if(orig !== 'N' && orig !== n && friends(orig, n)){
    if(hasCapital(st, orig) || TMAP[tid].cap === orig) newOwn = orig;
  }
  t.own = newOwn;
  // units of the liberating attacker remain; fine to share a territory with allies
  if(TMAP[tid].cap){
    const capOf = TMAP[tid].cap;
    if(capOf === newOwn){
      log(st, n, NATIONS[capOf].name + ' is liberated — ' + NATIONS[capOf].name + ' rejoins the war.', 'capital');
    } else if(prev === capOf){
      const loot = st.cash[capOf] || 0;
      st.cash[n] += loot; st.cash[capOf] = 0; st.pend[capOf] = {};
      log(st, n, 'CAPITAL FALLS: ' + TMAP[tid].name + ' captured. ' + loot + ' IPC seized from the ' + NATIONS[capOf].adj + ' treasury.', 'capital');
    }
  }
  st.stats.captures.push({round:st.round, by:n, tid, from:prev});
}

/* ---------------- non-combat move ---------------- */
function moveTargets(st, n, from, k){
  // where unit k of n at from can go in non-combat: friendly territories within move along friendly path
  const U = UNITS[k];
  const out = [];
  if(U.dom === 'land'){
    const range = k === 'arm' ? 2 : 1;
    const d = dists(from, (x) => canEnter(st, x, n), range);
    for(const id in d){
      if(id === from || !canEnter(st, id, n)) continue;
      if(k === 'arm' && d[id] === 2){
        // second step may not follow a sea lane taken on step one
        const ok = ADJ[from].some(m => d[m] === 1 && canEnter(st, m, n) && !isSea(from,m) && ADJ[m].includes(id) && !isSea(m,id));
        if(!ok) continue;
      }
      if(room(st, id) > 0) out.push(id);
    }
  } else {
    const d = dists(from, null, U.move);
    for(const id in d){ if(id !== from && canEnter(st, id, n) && room(st, id) > 0) out.push(id); }
  }
  return out;
}
function doMove(st, n, from, to, units){
  let r = room(st, to);
  units = Object.assign({}, units);
  for(const k of UKEYS){ if(units[k]){ units[k] = Math.min(units[k], r); r -= units[k]; if(!units[k]) delete units[k]; } }
  if(!tot(units)) return null;
  takeUnits(st, from, n, units);
  putUnits(st, to, n, units);
  markMoved(st, to, n, units);
  return units;
}

/* ---------------- purchase & mobilize ---------------- */
function buy(st, n, k, delta){
  const c = costOf(n, k, st);
  const cur = st.pend[n][k] || 0;
  if(delta > 0 && st.cash[n] < c) return false;
  if(delta < 0 && cur <= 0) return false;
  st.pend[n][k] = cur + delta;
  st.cash[n] -= c * delta;
  if(!st.pend[n][k]) delete st.pend[n][k];
  return true;
}
function factories(st, n){
  const out = [];
  for(const id in st.terr){
    const T = TMAP[id];
    if(st.terr[id].own !== n || !T.factory) continue;
    if(T.cap && T.cap !== n){ out.push({id, limit: T.ipc}); continue; }
    out.push({id, limit: T.factory});
  }
  return out;
}
/* place: {tid:{k:n}} ; default everything at capital */
function mobilize(st, n, place){
  const pend = st.pend[n];
  if(!tot(pend)) return;
  if(!place){
    place = {};
    const cap = NATIONS[n].cap;
    if(st.terr[cap].own === n) place[cap] = clone(pend);
    else {
      const f = factories(st, n)[0];
      if(f) place[f.id] = clone(pend);
    }
  }
  const spill = {};
  for(const id in place){
    if(st.terr[id].own !== n){ addU(spill, place[id]); continue; }
    const u = {}; let r = room(st, id);
    for(const k of UKEYS){ const q = place[id][k]||0; const put = Math.min(q, r); r -= put; if(put) u[k] = put; if(q-put) spill[k] = (spill[k]||0)+q-put; }
    putUnits(st, id, n, u);
  }
  // overflow walks to the nearest own territory with room
  if(tot(spill)){
    const cap = NATIONS[n].cap;
    const near = ADJ[cap].filter(x => st.terr[x].own === n).concat(Object.keys(st.terr).filter(x => st.terr[x].own === n));
    for(const k of UKEYS){
      let q = spill[k]||0;
      for(const id of near){ if(q <= 0) break; const r = room(st, id); const put = Math.min(q, r); if(put){ putUnits(st, id, n, {[k]:put}); q -= put; } }
      if(q > 0){ st.cash[n] += q * costOf(n,k); }
    }
  }
  st.pend[n] = {};
}

/* ---------------- turn flow ---------------- */
const PHASES = ['purchase','combat','move','mobilize'];
function nextPhase(st){
  const n = active(st);
  const i = PHASES.indexOf(st.phase);
  if(i < PHASES.length-1){ st.phase = PHASES[i+1]; return; }
  endTurn(st);
}
function endTurn(st){
  const n = active(st);
  // collect income
  const inc = income(st, n);
  st.cash[n] += inc;
  if(n === 'US' && st.opts.lendLease > 0 && hasCapital(st,'US')){
    const allies = ['UA','IL'].filter(a => hasCapital(st, a));
    if(allies.length){
      allies.sort((a,b) => income(st,a) - income(st,b));
      const a = allies[0], amt = Math.min(st.opts.lendLease, st.cash.US);
      if(amt > 0){ st.cash.US -= amt; st.cash[a] += amt; log(st, 'US', 'Lend-Lease: ' + amt + ' IPC shipped to ' + NATIONS[a].name + '.', 'econ'); }
    }
  }
  if(inc) log(st, n, 'Collects ' + inc + ' IPC. Treasury ' + st.cash[n] + '.', 'econ');
  // reset turn flags
  for(const id in st.terr) st.terr[id].moved = {};
  st.attacked = {};
  // advance
  let guard = 0;
  do {
    st.turnIdx++;
    if(st.turnIdx >= ORDER.length){
      st.turnIdx = 0;
      endRound(st);
      if(st.over) return;
      st.round++;
      log(st, 'SYS', 'Round ' + st.round + ' begins.', 'round');
    }
    guard++;
  } while(!alive(st, active(st)) && guard < 12);
  st.phase = 'purchase';
}
function capitalsHeld(st, side){
  return Object.keys(CAPS).filter(n => sideOf(st.terr[CAPS[n]].own) === side);
}
/* Points = territory value gained since the start of the war, +12 for each enemy capital held */
function sidePoints(st, side){
  let p = 0;
  for(const id in st.terr){
    const own = st.terr[id].own, T = TMAP[id];
    const was = sideOf(T.own) === side, is = own !== 'N' && sideOf(own) === side;
    if(is && !was) p += T.ipc + (T.cap ? 12 : 0);
    if(was && !is) p -= T.ipc + (T.cap ? 12 : 0);
  }
  return p;
}
function checkVictory(st){
  const axisCaps = ['moscow','tehran'], allyCaps = ['kyiv','jerusalem','washington'];
  const alliesWin = axisCaps.every(c => sideOf(st.terr[c].own) === 'B');
  const axisTaken = allyCaps.filter(c => sideOf(st.terr[c].own) === 'A').length;
  if(alliesWin) return {side:'B', how:'Allied forces hold both Moscow and Tehran.'};
  if(axisTaken >= 2) return {side:'A', how:'The Axis holds two Allied capitals.'};
  return null;
}
function endRound(st){
  const v = checkVictory(st);
  if(v){ st.over = Object.assign({round:st.round, decisive:true}, v); log(st,'SYS','VICTORY — ' + SIDE_NAME[v.side] + '. ' + v.how, 'win'); return; }
  if(st.round >= st.opts.roundLimit){
    const a = sidePoints(st,'A'), b = sidePoints(st,'B');
    const side = a > b ? 'A' : b > a ? 'B' : 'D';
    st.over = {side, round:st.round, decisive:false, how:'Armistice after round ' + st.round + ' — decided on points (' + a + ' Axis vs ' + b + ' Allies).', pts:{A:a,B:b}};
    log(st,'SYS', st.over.how, 'win');
  }
}

/* ================= BOTS ================= */
/* Fast Monte Carlo of a battle. a/d: arrays of hit values sorted by removal order. */
function mcOdds(st, aList, dList, trials, rng){
  rng = rng || Math.random;
  if(!dList.length) return {p:1, aLeft:aList.length, aLoss:0};
  if(!aList.length) return {p:0, aLeft:0, aLoss:0};
  let wins = 0, lossSum = 0;
  const A0 = aList.map(x => x.v), D0 = dList.map(x => x.v);
  const Acost = aList.map(x => x.cost), Aland = aList.map(x => UNITS[x.k].dom === 'land');

function chips(units, c, showZero, keys){
  keys = keys || E.UKEYS;
  return '<div class="chips">' + keys.filter(k => showZero || units[k]).map(k =>
    '<div class="chip ' + (units[k] ? '' : 'zero') + '" title="' + E.UNITS[k].name + '"><div class="tile" style="--c:' + c + '">' + icon(k) + '</div><div class="n">' + (units[k]||0) + '</div></div>').join('') + '</div>';

function bar(frac, c, n){
  n = n || 12; const on = Math.round(Math.max(0, Math.min(1, frac)) * n);
  let h = ''; for(let i=0;i<n;i++) h += '<i class="' + (i < on ? 'on' : '') + '"></i>';
  return '<div class="bar" style="--c:' + c + '">' + h + '</div>';
}
function radarSVG(pct, c, label){
  const a = Math.max(0, Math.min(1, pct)) * Math.PI * 2;
  const r = 30, x = 35 + Math.sin(a) * r, y = 35 - Math.cos(a) * r;
  const large = a > Math.PI ? 1 : 0;
  const arc = pct >= .999 ? '<circle cx="35" cy="35" r="30" fill="' + c + '" opacity=".35"/>' : pct <= 0 ? '' : '<path d="M35 35 L35 5 A30 30 0 ' + large + ' 1 ' + x.toFixed(1) + ' ' + y.toFixed(1) + ' Z" fill="' + c + '" opacity=".35"/>';
  return '<svg viewBox="0 0 70 70"><circle cx="35" cy="35" r="33" fill="#0d1319" stroke="#3a4a5a" stroke-width="2"/>'
    + '<circle cx="35" cy="35" r="22" fill="none" stroke="#24313d"/><circle cx="35" cy="35" r="11" fill="none" stroke="#24313d"/>'
    + '<path d="M35 3v64M3 35h64" stroke="#24313d"/>' + arc
    + '<line x1="35" y1="35" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="' + c + '" stroke-width="2"/>'
    + '<circle cx="35" cy="35" r="3" fill="' + c + '"/>'
    + (label ? '<text x="35" y="62" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#cfd8e0">' + label + '</text>' : '')
    + '</svg>';
}

/* ================= AUDIO ================= */
const SFX = (() => {
  let ac = null, last = 0;
  const ctx = () => { if(!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ac = null; } } return ac; };
  function noise(dur, freq, type, vol){
    if(!SET.sound) return;
    const a = ctx(); if(!a) return;
    const now = a.currentTime;
    if(now - last < 0.012) return; last = now;
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }
  return {
    shot: () => noise(0.09, 1800, 'highpass', 0.10),
    cannon: () => noise(0.35, 380, 'lowpass', 0.22),
    boom: () => noise(0.6, 220, 'lowpass', 0.32),
    dice: () => noise(0.05, 3000, 'bandpass', 0.08),
    unlock: () => { const a = ctx(); if(a && a.state === 'suspended') a.resume(); }
  };
})();
document.addEventListener('pointerdown', () => SFX.unlock(), {once:false});

/* ================= GAME START ================= */
function startGame(mode, human){
  G.mode = mode; G.human = mode === 'play' ? human : null;
  G.st = E.newGame(Object.assign(engineOpts(), {human:G.human}));
  G.paused = false; G.sel = null; G.combat = null; G.move = null; G.place = null;
  enterGame();
  E.log(G.st, 'SYS', mode === 'sim' ? 'Simulation started — five bots, one war.' : 'You command ' + NAT[human].name + '. Capital: ' + TNAME(NAT[human].cap) + '.');
  render();
  advance();
}
function resumeGame(){
  try {
    const s = JSON.parse(localStorage.getItem(SAVEKEY));
    G.mode = 'play'; G.human = s.human; G.st = s.st; G.st.rng = E.makeRng(null);
    Object.assign(SET, s.set || {});
    G.paused = false; G.sel = null; G.combat = null; G.move = null; G.place = null;
    enterGame(); render(); advance();
  } catch(e){ try { localStorage.removeItem(SAVEKEY); } catch(_){} showSetup(); }
}
function saveGame(){
  if(G.mode !== 'play' || !G.st) return;
  try {
    if(G.st.over){ localStorage.removeItem(SAVEKEY); return; }
    const st = Object.assign({}, G.st); delete st.rng;
    localStorage.setItem(SAVEKEY, JSON.stringify({human:G.human, st, set:SET}));
  } catch(e){}
}
function enterGame(){
  G.gen++;
  $('#setup').classList.add('hidden');
  $('#game').classList.remove('hidden');
  buildMap();
  viewTheatre(G.human ? NAT[G.human].cap : null);
}

/* ================= ORIENTATION (in-game landscape on phones) ================= */
function LX(e){ return G.rot ? e.clientY : e.clientX; }
function LY(e){ return G.rot ? window.innerWidth - e.clientX : e.clientY; }
function LR(el){
  const r = el.getBoundingClientRect();
  if(!G.rot) return r;
  return {left:r.top, top:window.innerWidth - r.right, width:r.height, height:r.width, right:r.bottom, bottom:window.innerWidth - r.left};
}
function isPhone(){ const w = window.innerWidth, h = window.innerHeight; return (matchMedia('(pointer: coarse)').matches && Math.min(w, h) < 820) || Math.min(w, h) < 520; }
function applyOrient(){
  const w = window.innerWidth, h = window.innerHeight, B = document.body;
  const rot = SET.rotate !== 'off' && isPhone() && h > w;
  G.rot = rot;
  B.classList.toggle('rot', rot);
  B.style.width = rot ? h + 'px' : ''; B.style.height = rot ? w + 'px' : '';
  B.style.setProperty('--bh', (rot ? w : h) + 'px');
  const shortSide = rot ? w : Math.min(w, h);
  B.classList.toggle('compact', shortSide < 560 || (rot ? h : w) < 900);
  if(B.classList.contains('compact') && SET.leftCollapsed == null){ SET.leftCollapsed = true; }
  if(G.vb) setTimeout(fitVb, 60);
}
window.addEventListener('resize', applyOrient);
window.addEventListener('orientationchange', () => setTimeout(applyOrient, 120));

const SVGNS = 'http://www.w3.org/2000/svg';
function buildMap(){

  const svg = $('#map');
  let defs = '<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#0b2230"/><line x1="0" y1="0" x2="0" y2="7" stroke="#123a4c" stroke-width="2"/></pattern>'

    + '<filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
    + '<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>';
  let shapes = '';
  E.TERR.forEach(t => {
    const m = MAP.terr[t.id];

      cp = ' clip-path="url(#cp-' + t.id + ')"';
    }
    shapes += '<g' + cp + '><path class="terr" data-id="' + t.id + '" d="' + m.d + '" stroke-width="1.2" vector-effect="non-scaling-stroke"/></g>';
  });
  defs += '</defs>';
  const labels = MAP.oceans.map(o => '<text x="' + o[1] + '" y="' + o[2] + '" class="olab">' + o[0] + '</text>').join('');
  svg.innerHTML = defs
    + '<rect x="-2000" y="-1000" width="' + (MAP.W+4000) + '" height="' + (MAP.H+2000) + '" fill="#020c14"/>'
    + '<path d="' + MAP.grat + '" fill="none" stroke="#0f3a4d" stroke-opacity=".7" stroke-width="1" vector-effect="non-scaling-stroke"/>'
    + '<g id="shapes">' + shapes + '</g>'
    + '<g id="lanes"></g><g id="labels" style="pointer-events:none">' + labels + '</g>'
    + '<g id="arrows"></g><g id="markers"></g><g id="fx"></g>';
  const st = document.createElementNS(SVGNS, 'style');
  st.textContent = '.clab{font-family:JetBrains Mono;fill:#1f5a70;font-size:10px}.olab{font-family:JetBrains Mono;letter-spacing:.4em;fill:#155066;font-size:11px}';
  svg.appendChild(st);
  drawLanes();

function drawLanes(){
  let h = '';
  E.EDGES.forEach(([a,b,k]) => {
    const A = MAP.terr[a], B = MAP.terr[b];
    if(k === 's' && Math.abs(A.x - B.x) > MAP.W/2){
      // Bering: wrap around the map edge
      const [L, R] = A.x < B.x ? [A, B] : [B, A];
      h += '<path d="M' + R.x + ' ' + R.y + ' Q' + (R.x + 120) + ' ' + (R.y - 40) + ' ' + (MAP.W + 40) + ' ' + (R.y - 10) + '" class="lane sea"/>';
      h += '<path d="M-40 ' + (L.y - 10) + ' Q' + (L.x - 60) + ' ' + (L.y - 30) + ' ' + L.x + ' ' + L.y + '" class="lane sea"/>';
      return;
    }
    if(k === 's'){
      const mx = (A.x + B.x)/2, my = (A.y + B.y)/2, dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
      const off = Math.min(80, len * 0.18);
      h += '<path d="M' + A.x + ' ' + A.y + ' Q' + (mx - dy/len*off) + ' ' + (my + dx/len*off) + ' ' + B.x + ' ' + B.y + '" class="lane sea"/>';
    } else h += '<path d="M' + A.x + ' ' + A.y + ' L' + B.x + ' ' + B.y + '" class="lane"/>';
  });
  $('#lanes').innerHTML = h;
  const st = document.createElementNS(SVGNS, 'style');
  st.textContent = '.lane{fill:none;stroke:#3ee8ff;stroke-opacity:.22;stroke-width:1.6;vector-effect:non-scaling-stroke}.lane.sea{stroke:#4a90c7;stroke-opacity:.55;stroke-dasharray:6 5}';
  $('#map').appendChild(st);
}
function XY(lon, lat){ const k = MAP.W/360; return {x: MAP.W/2 + (lon - 12)*k, y: MAP.H/2 - lat*1.18*k}; }
function viewTheatre(focus){
  const a = XY(-6, 64), b = XY(78, 18);
  G.vb = {x:a.x, y:a.y, w:b.x - a.x, h:b.y - a.y};
  fitVb(true);
  if(focus){ const m = MAP.terr[focus]; centerOn(m.x, m.y); }
}
function viewWorld(){ G.vb = {x:0, y:XY(0,78).y, w:MAP.W, h:XY(0,-30).y - XY(0,78).y}; fitVb(true); }
function fitVb(keepW){
  const el = $('#mapwrap'); if(!el) return;
  const r = LR(el); if(!r.width) return;
  const asp = r.height / r.width;
  const vb = G.vb;
  vb.w = Math.max(160, Math.min(MAP.W * 1.05, vb.w));
  const cy = vb.y + vb.h/2;
  vb.h = vb.w * asp; vb.y = cy - vb.h/2;
  vb.x = Math.max(-80, Math.min(MAP.W + 80 - vb.w, vb.x));
  vb.y = Math.max(-40, Math.min(MAP.H - vb.h + 40, vb.y));
  $('#map').setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h);
  drawMarkers();
}
function centerOn(x, y){ G.vb.x = x - G.vb.w/2; G.vb.y = y - G.vb.h/2; fitVb(); }
function zoomAtLocal(cx, cy, f){ const r = LR($('#mapwrap')); zoomAt(cx, cy, f, true); }
function zoomAt(cx, cy, f){
  const el = $('#mapwrap'), r = LR(el);
  const rx = (cx - r.left)/r.width, ry = (cy - r.top)/r.height, vb = G.vb;
  const sx = vb.x + rx*vb.w, sy = vb.y + ry*vb.h;
  const w = Math.max(160, Math.min(MAP.W*1.05, vb.w * f));
  G.vb = {x: sx - rx*w, y: sy - ry*w*(vb.h/vb.w), w, h: w*(vb.h/vb.w)};
  fitVb();
}
function bindMap(){
  const el = $('#mapwrap');
  let drag = null;
  el.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(LX(e), LY(e), e.deltaY > 0 ? 1.15 : 1/1.15); }, {passive:false});
  const pts = new Map(); let pinch = null;
  el.addEventListener('pointerdown', (e) => { pts.set(e.pointerId, {x:LX(e), y:LY(e)}); if(pts.size === 2){ const [a, c] = [...pts.values()]; pinch = {d:Math.hypot(a.x-c.x, a.y-c.y)}; drag = null; } }, true);
  el.addEventListener('pointermove', (e) => {
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId, {x:LX(e), y:LY(e)});
    if(pinch && pts.size === 2){ const [a, c] = [...pts.values()]; const d = Math.hypot(a.x-c.x, a.y-c.y); if(d > 10){ const r = LR(el); const mx = (a.x+c.x)/2, my = (a.y+c.y)/2;
      zoomAtLocal(mx, my, pinch.d / d); pinch.d = d; } e.stopImmediatePropagation(); }
  }, true);
  const lift = (e) => { pts.delete(e.pointerId); if(pts.size < 2) pinch = null; };
  el.addEventListener('pointerup', lift, true); el.addEventListener('pointercancel', lift, true);
  el.addEventListener('pointerdown', (e) => { if(pinch || e.target.closest('.mapbtns') || e.target.closest('#b-left') || e.target.closest('#b-right')) return; drag = {x:LX(e), y:LY(e), vb:Object.assign({}, G.vb), moved:false}; });
  el.addEventListener('pointermove', (e) => {
    if(drag){
      const dx = LX(e) - drag.x, dy = LY(e) - drag.y;
      if(!drag.moved && Math.hypot(dx, dy) < 5) return;
      if(!drag.moved){ drag.moved = true; el.style.cursor = 'grabbing'; try { el.setPointerCapture(e.pointerId); } catch(_){} hideTip(); }
      const r = LR(el);
      G.vb.x = drag.vb.x - dx/r.width*drag.vb.w; G.vb.y = drag.vb.y - dy/r.height*drag.vb.h; fitVb();
      return;
    }
    const mk = e.target.closest('[data-id]');
    if(mk) showTip(mk.dataset.id, e); else hideTip();
    const rr = LR(el), vb = G.vb, k = MAP.W/360;
    const mx = vb.x + (LX(e) - rr.left)/rr.width*vb.w, my = vb.y + (LY(e) - rr.top)/rr.height*vb.h;
    let lon = (mx - MAP.W/2)/k + 12; if(lon > 180) lon -= 360; const lat = (MAP.H/2 - my)/(1.18*k);
    const hx = $('#hudxy'); if(hx) hx.textContent = 'LAT ' + (lat>=0?'+':'') + lat.toFixed(2) + ' · LON ' + (lon>=0?'+':'') + lon.toFixed(2);
  });
  const end = (e) => {
    if(!drag) return;
    const wasMoved = drag.moved; drag = null; el.style.cursor = '';
    if(!wasMoved){ const mk = e.target.closest && e.target.closest('[data-id]'); if(mk) clickTerr(mk.dataset.id); }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', () => { hideTip(); });
  $('#z-in').onclick = () => { const r = LR(el); zoomAt(r.left + r.width/2, r.top + r.height/2, 1/1.3); };
  $('#z-out').onclick = () => { const r = LR(el); zoomAt(r.left + r.width/2, r.top + r.height/2, 1.3); };

}

    h += '<g class="' + cls + '" data-id="' + T.id + '" transform="translate(' + m.x + ',' + m.y + ') scale(' + s + ')">'

function labelPos(T, cap, small){
  const r = cap ? 24 : small ? 13 : 18;

function highlights(){
  const out = {}, st = G.st;
  if(!st || G.mode !== 'play' || E.active(st) !== G.human || G.running) return out;
  const n = G.human;
  if(st.phase === 'combat'){
    for(const id in st.terr) if(E.canAttack(st, n, id)) out[id] = 'tgt';
    if(G.combat) { out[G.combat.tgt] = 'sel'; }
  } else if(st.phase === 'move'){
    if(G.move && G.move.from){
      out[G.move.from] = 'sel';
      moveDests(G.move.from).forEach(d => out[d] = 'dst');
      if(G.move.to) out[G.move.to] = 'sel';
    } else for(const id in st.terr) if(E.tot(E.movable(st, id, n)) && moveDests(id).length) out[id] = 'src';
  }
  return out;
}
function moveDests(from){
  const st = G.st, n = G.human, mv = E.movable(st, from, n), s = new Set();
  E.UKEYS.forEach(k => { if(mv[k]) E.moveTargets(st, n, from, k).forEach(d => s.add(d)); });

}

/* arrows for moves/attacks */
function arrow(from, to, c, cls){
  const A = MAP.terr[from], B = MAP.terr[to];
  let ax = A.x, bx = B.x;
  if(Math.abs(ax - bx) > MAP.W/2){ if(ax < bx) ax += MAP.W; else bx += MAP.W; }
  const mx = (ax + bx)/2, my = (A.y + B.y)/2 - Math.min(60, Math.hypot(bx-ax, B.y-A.y)*0.25);
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('d', 'M' + ax + ' ' + A.y + ' Q' + mx + ' ' + my + ' ' + bx + ' ' + B.y);
  p.setAttribute('fill', 'none'); p.setAttribute('stroke', c); p.setAttribute('stroke-width', cls === 'move' ? 3 : 4.5);
  p.setAttribute('vector-effect', 'non-scaling-stroke'); p.setAttribute('marker-end', 'url(#ah)');
  p.setAttribute('stroke-linecap', 'round');
  if(cls === 'move') p.setAttribute('stroke-dasharray', '8 6');
  p.style.filter = 'url(#glow)';
  const len = 2000; p.style.strokeDasharray = cls === 'move' ? '8 6' : len; p.style.strokeDashoffset = cls === 'move' ? 0 : len;
  p.style.transition = 'stroke-dashoffset .6s ease-out';
  $('#arrows').appendChild(p);
  requestAnimationFrame(() => { p.style.strokeDashoffset = 0; });
  return p;
}

function pickedForces(){
  const c = G.combat; if(!c) return [];

}
function calcOdds(){
  const st = G.st, f = pickedForces();
  if(!f.some(x => E.UNITS[x.k].dom === 'land')) return null;
  const key = JSON.stringify(f) + G.combat.tgt;
  if(G.odds && G.odds.key === key) return G.odds.p;
  const a = E.sortRemoval(E.expandAtk(G.human, f), true), d = E.sortRemoval(E.expandDef(st, G.combat.tgt), false);
  const p = E.mcOdds(st, a, d, 400, Math.random).p;
  G.odds = {key, p};
  return p;
}

  E.UKEYS.forEach(k => { const extra = (st.pend[n][k]||0) - (placed[k]||0); if(extra > 0){ place[cap] = place[cap] || {}; place[cap][k] = (place[cap][k]||0) + extra; } });

function clickTerr(id){
  const st = G.st; if(!st) return;
  const n = G.human;
  const mine = G.mode === 'play' && E.active(st) === n && !G.running && !st.over;
  if(mine && st.phase === 'combat'){
    if(E.canAttack(st, n, id)){ G.combat = {tgt:id, pick:{}}; G.sel = id; G.odds = null;
      // preselect all land units adjacent for convenience
      E.attackSources(st, n, id).forEach(s => { if(E.UNITS[s.k].dom === 'land' && s.from !== NAT[n].cap) G.combat.pick[s.from+'|'+s.k] = s.max; });

  }

    if(E.tot(E.movable(st, id, n)) && moveDests(id).length){ G.move = {from:id, to:null, pick:{}}; G.sel = id; render(); return; }

/* ================= BOTS / FLOW ================= */
function speedMul(){
  if(G.mode === 'sim') return G.simSpeed;
  return {slow:0.6, normal:1, fast:2.2, instant:99}[SET.botSpeed] || 1;
}
async function wait(ms){
  const g = G.gen;
  const mul = speedMul();
  if(mul >= 99){ await sleep(0); if(g !== G.gen) throw STOP; while(G.paused){ await sleep(80); if(g !== G.gen) throw STOP; } return; }
  let t = 0; const lim = ms / mul;
  while(t < lim || G.paused){ await sleep(30); t += 30; if(g !== G.gen) throw STOP; }
}
async function gate(){
  if(G.mode === 'sim' || SET.pacing !== 'step') return;
  const g = G.gen;
  await new Promise(res => { G.nextGate = res; renderTop(); });
  if(g !== G.gen) throw STOP;
}
function animateBattle(b){
  const mul = speedMul();
  if(mul >= 99) return false;
  const hum = G.human;
  if(G.mode === 'sim'){
    if(G.simAnim === 'off') return false;
    if(G.simAnim === 'caps') return !!E.TMAP[b.tgt].cap;
    return true;
  }
  if(SET.battleAnim === 'off') return false;
  if(SET.battleAnim === 'all') return true;
  return b.defNations.includes(hum) || b.defOwn === hum || (E.TMAP[b.tgt].cap && E.TMAP[b.tgt].cap === hum);
}
async function botTurn(n){
  const st = G.st, N = NAT[n];
  st.phase = 'purchase';
  if(speedMul() < 99) focusOn(N.cap);
  render();
  const before = E.clone(st.pend[n]);
  E.botPurchase(st, n);
  const bought = st.pend[n];
  if(E.tot(bought)) { E.log(st, n, 'Orders ' + E.UKEYS.filter(k => bought[k]).map(k => bought[k] + ' ' + E.UNITS[k].ab).join(', ') + '.', 'buy'); setMsg(N.name + ' places orders.'); }
  render(); await wait(650); await gate();
  st.phase = 'combat'; render();
  let guard = 0;
  while(guard++ < 12){
    const plan = E.botPlanAttack(st, n);
    if(!plan) break;
    const froms = Array.from(new Set(plan.forces.map(f => f.from)));
    froms.forEach(f => arrow(f, plan.tid, N.color, 'atk'));
    if(speedMul() < 99) focusOn(plan.tid);
    setMsg(N.name + ' attacks ' + TNAME(plan.tid) + (st.terr[plan.tid].own !== 'N' ? ' (' + nameOf(st.terr[plan.tid].own) + ')' : '') + '.');
    await wait(750);
    const b = E.createBattle(st, n, plan.tid, plan.forces);
    if(animateBattle(b)) await Battle.run(b, {interactive:false});
    else { while(!b.done){ E.battleRound(st, b); if(!b.done && E.botShouldRetreat(st, b)) E.retreatBattle(st, b); } }
    const txt = E.finishBattle(st, b);
    clearArrows();
    burst(plan.tid, b.outcome === 'won' ? N.color : '#8a98a6');
    if(b.outcome === 'won' && E.TMAP[plan.tid].cap) banner(E.TMAP[plan.tid].name + ' has fallen', N.color, 2200);
    setMsg(N.name + ': ' + txt);
    render(); await wait(600); await gate();
  }
  st.phase = 'move'; render();
  const moves = E.botNonCombat(st, n);
  const shown = moves.slice(0, 10);
  shown.forEach(m => arrow(m.from, m.to, N.color, 'move'));
  if(moves.length) setMsg(N.name + ' repositions ' + moves.reduce((s,m) => s + E.tot(m.units), 0) + ' units.');
  render(); await wait(moves.length ? 800 : 250);
  clearArrows();
  st.phase = 'mobilize';
  E.mobilize(st, n, E.botPlacement(st, n));
  render(); await wait(350);
  E.endTurn(st);
}
async function advance(){
  if(G.running) return;
  G.running = true; render();
  const g = G.gen;
  try {
    while(!G.st.over && (G.mode === 'sim' || E.active(G.st) !== G.human || !E.alive(G.st, G.human))){
      if(G.mode === 'play' && !E.alive(G.st, G.human) && !G.spectate){ G.spectate = true; banner('Your flag is out of the war', '#e2483b', 3000); }
      await botTurn(E.active(G.st));
      if(g !== G.gen) return;
      if(G.mode === 'play') saveGame();
    }
  } catch(e){ if(e !== STOP) { console.error(e); } G.running = false; return; }
  G.running = false; G.spectate = false;
  render();
  if(G.st.over){ saveGame(); setTimeout(showEnd, 600); return; }
  // human turn starts
  const st = G.st, n = G.human;
  st.phase = 'purchase'; G.combat = null; G.move = null; G.place = null;
  banner('Your turn · Round ' + st.round, NAT[n].color, 1600);
  if(SET.rightCollapsed || G.focus){ SET.rightCollapsed = false; G.focus = false; if(G.applyPanels) G.applyPanels(); }
  setMsg(E.hasCapital(st, n) ? 'Purchase phase: buy units with your treasury.' : 'Your capital is occupied — you can still fight with surviving units.');
  centerIfOff(NAT[n].cap);
  render();
}
function focusOn(id){
  // smooth pan to a territory
  const m = MAP.terr[id], vb = G.vb; if(!vb) return;
  const tx = m.x - vb.w/2, ty = m.y - vb.h/2, sx = vb.x, sy = vb.y, t0 = performance.now();
  cancelAnimationFrame(G.panRaf);
  const stepF = (t) => { const f = Math.min(1, (t - t0)/600), e = f < .5 ? 2*f*f : 1 - Math.pow(-2*f+2, 2)/2;
    G.vb.x = sx + (tx - sx)*e; G.vb.y = sy + (ty - sy)*e; fitVb(); if(f < 1) G.panRaf = requestAnimationFrame(stepF); };
  G.panRaf = requestAnimationFrame(stepF);
}

  }
  function spriteOf(u){ return sprites.find(s => s.u === u); }

  function bann(text, ms){ const el = $('#bbanner'); el.textContent = text; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), ms || 1100); }
  function updateHead(){

    const cA = {}, cD = {};

    $('#bround').textContent = 'ROUND ' + b.round + (b.done ? ' · ' + b.outcome.toUpperCase() : '');
    const oc = odds >= .7 ? '#34c37f' : odds >= .4 ? '#f5b82e' : '#e2483b';
    $('#bodds').innerHTML = '<div class="radar" style="width:64px;height:64px">' + radarSVG(odds, oc) + '</div><div class="pct" style="color:' + oc + '">' + Math.round(odds*100) + '%</div><div class="lbl">Attacker odds</div>';
  }
  function setButtons(mode){

    else if(mode === 'auto') f.innerHTML = '<button class="btn ghost" id="bb-skip">Skip animation »</button>';
    else if(mode === 'done') f.innerHTML = '<button class="btn gold" id="bb-ok">Continue</button>';
    else f.innerHTML = '';
  }
  function waitClick(ids){
    return new Promise(res => { ids.forEach(id => { const el = $('#' + id); if(el) el.onclick = () => res(id); }); });
  }

  /* --- main --- */
  async function animateRound(res){
    const nm = (n) => n === 'N' ? 'Neutral' : NAT[n].adj;
    // barrage first
    if(res.barrage){
      bann('Opening barrage', 1200);
      await rollDice(res.barrage.rolls, null, NAT[b.atk].adj + ' barrage', 'Defenders hold fire', 600);
      const killed = res.barrage.killed.slice();
      res.barrage.rolls.forEach((r, i) => {
        const hit = r.r <= r.v; const sh = spriteOf(r.u);
        const tgt = hit ? spriteOf(killed.shift()) : pickTarget(1, r.k);
        fire(sh, tgt, hit && !!tgt, i*90 + Math.random()*120);
      });
      await bwait(1200);
    }
    const defName = b.defOwn === 'N' ? 'Neutral' : NAT[b.defOwn].adj;
    await rollDice(res.rollsA, res.rollsD, NAT[b.atk].adj + ' attack', defName + ' defence', 650);
    const kD = res.killedD.filter(u => !(res.barrage && res.barrage.killed.includes(u)));
    const kA = res.killedA.slice();
    let maxDelay = 0;
    res.rollsA.forEach((r, i) => {
      const hit = r.r <= r.v; const sh = spriteOf(r.u);
      const tgt = hit && kD.length ? spriteOf(kD.shift()) : pickTarget(1, r.k);
      const d = Math.random()*650; maxDelay = Math.max(maxDelay, d);
      fire(sh, tgt, hit && !!tgt, d);
    });
    res.rollsD.forEach((r, i) => {
      const hit = r.r <= r.v; const sh = spriteOf(r.u);
      const tgt = hit && kA.length ? spriteOf(kA.shift()) : pickTarget(0, r.k);
      const d = Math.random()*650; maxDelay = Math.max(maxDelay, d);
      fire(sh, tgt, hit && !!tgt, d);
    });
    await bwait(maxDelay + 900);
    // make sure all casualties are marked dead even if not displayed by a hit
    res.killedA.concat(res.killedD).forEach(u => { const s = spriteOf(u); if(s && s.alive){ s.alive = false; s.die = tNow; } });
    updateHead();
  }
  function pickTarget(side, shooterK){
    const al = aliveOf(side);

    const air = E.UNITS[shooterK].dom === 'air';
    const pool = air ? al : al.filter(s => E.UNITS[s.k].dom === 'land').concat(al);
    return pool[Math.floor(Math.random()*pool.length)];
  }
  async function run(battle, options){

    mul = G.mode === 'sim' ? Math.min(3, G.simSpeed) : opt.interactive ? 1 : ({slow:0.8, normal:1.2, fast:2, instant:5}[SET.botSpeed] || 1);

    $('#bh-d').innerHTML = '<div><div class="rl">Defender</div><div class="nm" style="color:' + colorOf(defN) + '">' + (defN === 'N' ? 'Neutral ' + T.name : NAT[defN].name) + '</div><div class="bforce" id="bforce-d" style="justify-content:flex-end"></div></div>' + portrait(defN);
    $('#btitle').innerHTML = '<div class="h">Battle for ' + T.name + '</div><div class="s" id="bround">ROUND 0</div>';
    $('#bres').textContent = '';
    $('#brules-body').innerHTML = rollRules(b);
    $('#tray-a').innerHTML = '<h5><span>Attacker dice</span></h5>'; $('#tray-d').innerHTML = '<h5><span>Defender dice</span></h5>';

    bg = makeBg(b.tgt);

    const saveA = b.A; b.A = b.A.concat(preKilled);
    build(); b.A = saveA;
    lastT = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
    updateHead();
    setButtons(opt.interactive ? 'none' : 'auto');
    const sk = $('#bb-skip'); if(sk) sk.onclick = () => { skip = true; mul = 99; };
    try {
      bann(b.defOwn === 'N' ? 'Assault' : 'Engage', 900);
      await bwait(900);
      if(b.preFire){
        bann('Iron Dome intercept', 1400);
        await rollDice(null, b.preFire.rolls.map(r => Object.assign({}, r, {k:'inf', v:1})), 'Incoming aircraft', 'Iron Dome', 600);
        const killed = b.preFire.killed.slice();
        const shooters = sprites.filter(s => s.side === 1);
        b.preFire.rolls.forEach((r, i) => {
          const hit = r.r <= 1; const tgt = hit && killed.length ? spriteOf(killed.shift()) : spriteOf(r.u);
          const sh = shooters[i % Math.max(1, shooters.length)];
          if(sh) fire(Object.assign({}, sh, {k:'drn'}), tgt, hit, i*120);
        });
        await bwait(1300);
        preKilled.forEach(u => { const s = spriteOf(u); if(s && s.alive){ s.alive = false; s.die = tNow; } });
      }
      while(!b.done){
        let auto = !opt.interactive;
        if(opt.interactive && !opt.autoAll){
          setButtons('human');
          const c = await waitClick(['bb-roll','bb-auto','bb-ret']);
          if(c === 'bb-ret'){ E.retreatBattle(st, b); break; }
          if(c === 'bb-auto'){ opt.autoAll = true; mul = 2.2; }
          setButtons('none');
        }
        const res = E.battleRound(st, b);
        if(res) await animateRound(res);
        if(!b.done && !opt.interactive && E.botShouldRetreat(st, b)) E.retreatBattle(st, b);
        if(!b.done && opt.autoAll && b.A.length && b.D.length){
          // the human chose auto: retreat if hopeless
          const p = E.mcOdds(st, E.sortRemoval(b.A.slice(), true), E.sortRemoval(b.D.slice(), false), 200, Math.random).p;
          if(p < 0.08) E.retreatBattle(st, b);

      }

      if(b.outcome === 'won' || b.outcome === 'cleared'){ sprites.forEach(s => { if(s.side === 0 && s.alive) s.ex = s.x + 160; }); bann(b.outcome === 'won' ? T.name + ' captured' : 'Garrison wiped out', 2000); }
      else if(b.outcome === 'retreat' || b.outcome === 'stalemate'){ sprites.forEach(s => { if(s.side === 0 && s.alive) s.ex = -60; }); bann(b.outcome === 'retreat' ? 'Attackers withdraw' : 'Stalemate — withdraw', 2000); }

      $('#bres').innerHTML = 'Attacker lost ' + lost(b.lostA) + ' · Defender lost ' + lost(b.lostD);
      if(opt.interactive){ setButtons('done'); await waitClick(['bb-ok']); }
      else { setButtons('none'); await bwait(1500); }
    } finally {
      cancelAnimationFrame(raf);

    }
  }

})();

function rollRules(b){
  const an = b.atk, T = E.TMAP[b.tgt];
  const dn = b.defNations.length ? b.defNations : [b.defOwn];
  const row = (k) => { const dv = dn.map(n => E.defOf(n, k, b.tgt)); return '<tr><td>' + E.UNITS[k].name + '</td><td>' + E.atkOf(an, k) + (k === 'inf' ? ' (2 with artillery)' : '') + '</td><td>' + Math.max(...dv) + '</td></tr>'; };
  return '<div class="brgrid"><div><p><b>Every unit rolls one six-sided die per round.</b> A roll <b>at or under</b> the unit\'s value is a hit. Attacker uses ATK, defender uses DEF.</p>'
    + '<p>All hits land at the same time. Each hit destroys one enemy unit, cheapest first; the attacker keeps its last ground unit as long as possible.</p>'
    + (SET.barrage ? '<p><b>Opening barrage:</b> in round 1 the attacker\'s artillery and bombers fire first; their hits are removed before the defenders shoot back.</p>' : '')
    + (b.defOwn === 'IL' ? '<p><b>Iron Dome:</b> before the battle, each attacking aircraft is shot down on a roll of 1.</p>' : '')
    + '<p>Each artillery lifts one infantry to attack 2. After any round the attacker may retreat; after ' + E.DEFAULTS.maxRounds + ' rounds the attack stalls. Only surviving ground units capture ' + T.name + '; aircraft fly home.</p></div>'
    + '<table class="brtab"><tr><th>Unit</th><th>Hit on (ATK)</th><th>Hit on (DEF)</th></tr>' + E.UKEYS.map(row).join('') + '</table></div>';
}

    + '<div class="panel maplegend"><span><i></i>Border</span><span><i class="sea"></i>Sea lane</span><span><b style="color:var(--gold)">★</b> Capital</span><span><b class="gold">n</b> IPC</span></div>'
    + '<div class="panel banner" id="mbanner" style="opacity:0"></div>'

    + '<div class="panel tip hidden" id="tip"></div></div>'
    + '<div id="right"><div id="act"></div><div id="log"><div class="ph" style="cursor:pointer"><span class="num">LOG</span> War diary <span style="margin-left:auto;font-size:10px;opacity:.6">tap to hide</span></div><div id="loglist"></div></div></div>'
    + '<div id="foot"></div></div>'
    + '<div id="battle" class="ov hidden"><div class="panel modal notch"><div class="bhead"><div class="bside" id="bh-a"></div><div class="btitle" id="btitle"></div><div class="bside r" id="bh-d"></div></div>'
    + '<div class="bstage"><canvas id="bcanvas"></canvas><div class="bbanner" id="bbanner"></div></div>'
    + '<div class="bdice"><div class="tray" id="tray-a"></div><div class="bmid" id="bodds"></div><div class="tray" id="tray-d"></div></div>'

    + '<div class="bres" id="bres"></div><div class="bfoot" id="bfoot"></div></div></div>'

  // radar sweep on the right panel while bots play
  setInterval(() => { if(G.st && (G.running || G.mode === 'sim') && !$('#game').classList.contains('hidden')){ const r = $('#act .radar'); if(r){ const n = E.active(G.st); r.innerHTML = radarSVG(((Date.now()/1000)%2.5)/2.5, NAT[n].color); } } }, 120);
  applyOrient();
  showSetup();
}
window.FiveFlags = {G, E, render, startGame};
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
